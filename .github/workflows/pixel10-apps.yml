name: Build, sign and publish Pixel 10 desktop apps
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Build, sign, publish Beta, promote to Stable, or run checks only
        type: choice
        options: [validate, build, sign-only, beta, stable]
        default: validate
      build:
        description: App build number (YYYYMMDDNN)
      min_os:
        description: Oldest compatible Pixel 10 OS build (build only)
      max_os:
        description: Newest compatible Pixel 10 OS build (build only)
      source_commit:
        description: Source commit in the unsigned handoff (sign and publish)
      unsigned_digest:
        description: SHA-256 of the unsigned SHA256SUMS (sign and publish)
      tested_from:
        description: Stable only - predecessor app build tested on a relocked Pixel 10
      hardware_report:
        description: Stable only - qualification report URL
permissions: {}
concurrency:
  group: frankel-app-publication
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'chapeltech/grapheneos-desktop'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    env:
      OPERATION: ${{ inputs.operation }}
      BUILD_NUMBER: ${{ inputs.build }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      UNSIGNED_SUMS_SHA256: ${{ inputs.unsigned_digest }}
      REF_PROTECTED: ${{ github.ref_protected }}
      SIGNING_ENABLED: ${{ vars.PIXEL10_APP_SIGNING_ENABLED }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          if [[ "$OPERATION" == validate ]]; then
            df -h "$RUNNER_TEMP" /tmp /dev/shm
            for path in /usr/local/lib/android/sdk/ndk /usr/share/dotnet /opt/ghc /usr/local/swift; do
              if [[ -d "$path" ]]; then du -sh "$path"; fi
            done
            if [[ -x "$ANDROID_HOME/build-tools/35.0.0/aapt2" && -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]]; then
              echo 'Build-tools 35.0.0 present'
            fi
          fi
          bash -n release/pixel10/build-apps.sh
          python3 -m unittest discover -vs release/pixel10
          [[ "$OPERATION" == validate ]] && exit 0
          [[ "$GITHUB_REF" == refs/heads/release/pixel10 && "$REF_PROTECTED" == true ]] || {
            echo 'Protect release/pixel10 before using the app release workflow.' >&2; exit 1;
          }
          [[ "$BUILD_NUMBER" =~ ^20[0-9]{8}$ ]]
          [[ "$OPERATION" == build ]] && exit 0
          [[ "$SIGNING_ENABLED" == true ]] || { echo 'App signing has not been provisioned.' >&2; exit 1; }
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ && "$UNSIGNED_SUMS_SHA256" =~ ^[a-f0-9]{64}$ ]]
          test "$(git cat-file -t "$SOURCE_COMMIT")" = commit
          git merge-base --is-ancestor "$SOURCE_COMMIT" "$GITHUB_SHA"
          printf 'App build: `%s`\n\nSource: `%s`\n\nUnsigned SHA256SUMS digest: `%s`\n' \
            "$BUILD_NUMBER" "$SOURCE_COMMIT" "$UNSIGNED_SUMS_SHA256" >> "$GITHUB_STEP_SUMMARY"
        shell: bash
      - name: Check that the workflow can read signing protection rules
        if: inputs.operation == 'validate'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          endpoint="repos/$GITHUB_REPOSITORY/environments/pixel10-sign"
          gh api "$endpoint" --jq '{name, can_admins_bypass}'
          gh api "$endpoint/deployment-branch-policies" --jq '[.branch_policies[] | {type, name}]'
  build:
    needs: validate
    if: inputs.operation == 'build'
    runs-on: [self-hosted, linux, x64, pixel10-build]
    environment: pixel10-build
    permissions:
      contents: read
    env:
      BUILD_NUMBER: ${{ inputs.build }}
      MIN_OS: ${{ inputs.min_os }}
      MAX_OS: ${{ inputs.max_os }}
      APP_BUILD_ROOT: ${{ vars.APP_BUILD_ROOT }}
      NATIVE_INPUTS: ${{ vars.NATIVE_INPUTS }}
      NATIVE_SHA256: ${{ vars.NATIVE_SHA256 }}
      SDK_CHECKOUT: ${{ vars.SDK_CHECKOUT }}
      CATALOG_KEY: ${{ vars.APP_CATALOG_PUBLIC_KEY }}
      DESKTOP_CERT: ${{ vars.DESKTOP_APK_SHA256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: bash release/pixel10/build-apps.sh
      - run: sha256sum "$APP_BUILD_ROOT/$BUILD_NUMBER/unsigned/SHA256SUMS" >> "$GITHUB_STEP_SUMMARY"
  release:
    needs: validate
    if: inputs.operation == 'sign-only' || inputs.operation == 'beta' || inputs.operation == 'stable'
    permissions:
      actions: read
      contents: write
    runs-on: ${{ vars.PIXEL10_GITHUB_RUNNER || 'ubuntu-24.04' }}
    environment: ${{ inputs.operation == 'stable' && 'pixel10-stable' || 'pixel10-sign' }}
    env:
      RELEASE_KIND: apps
      CHANNEL: ${{ inputs.operation }}
      BUILD_NUMBER: ${{ inputs.build }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      UNSIGNED_SUMS_SHA256: ${{ inputs.unsigned_digest }}
      REF_PROTECTED: ${{ github.ref_protected }}
      TESTED_FROM_BUILD: ${{ inputs.tested_from }}
      HARDWARE_REPORT: ${{ inputs.hardware_report }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify signing protection and fetch the approved handoff
        env:
          GH_TOKEN: ${{ github.token }}
          HOSTED_RUNNER: ${{ runner.environment }}
          RELEASE_PHASE: prepare
        run: |
          python3 release/pixel10/hosted_security.py
          python3 release/pixel10/hosted_run.py
      - name: Sign using protected GitHub environment secrets
        if: inputs.operation != 'stable'
        env:
          RELEASE_PHASE: sign
          PIXEL10_APP_KEYS_1: ${{ secrets.PIXEL10_APP_KEYS_1 }}
          PIXEL10_APP_KEYS_2: ${{ secrets.PIXEL10_APP_KEYS_2 }}
        run: |
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"
          python3 release/pixel10/hosted_run.py
      - name: Verify signed APKs and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PHASE: verify-and-publish
        run: |
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"
          python3 release/pixel10/hosted_run.py
