name: Build unsigned Pixel 10 release
on:
  workflow_dispatch:
    inputs:
      build:
        description: Unique YYYYMMDDNN build number
        required: true
permissions:
  contents: read
concurrency: frankel-unsigned-build
jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: [self-hosted, linux, x64, pixel10-build]
    environment: pixel10-build
    timeout-minutes: 1440
    env:
      BUILD_NUMBER: ${{ inputs.build }}
      BUILD_ROOT: ${{ vars.BUILD_ROOT }}
      NATIVE_INPUTS: ${{ vars.NATIVE_INPUTS }}
      NATIVE_SHA256: ${{ vars.NATIVE_SHA256 }}
      CONTROLLER_SHA256: ${{ vars.CONTROLLER_SHA256 }}
      STYX_SHA256: ${{ vars.STYX_SHA256 }}
      WM_SHA256: ${{ vars.WM_SHA256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: bash release/pixel10/build.sh
      - name: Record offline handoff
        shell: bash
        run: |
          cd "$BUILD_ROOT/$BUILD_NUMBER/unsigned"
          sha256sum SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
