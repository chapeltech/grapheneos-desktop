name: Build unsigned Pixel 10 release
on:
  workflow_dispatch:
    inputs:
      build:
        description: Unique YYYYMMDDNN build number
        required: true
      validate_only:
        description: Run release tests without allocating the OS build runner
        type: boolean
        default: false
permissions:
  contents: read
concurrency: frankel-unsigned-build
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          bash -n release/pixel10/build.sh
          bash -n release/pixel10/offline-sign.sh
          python3 -m unittest discover -vs release/pixel10
  build:
    needs: validate
    if: github.ref_name == github.event.repository.default_branch && !inputs.validate_only
    runs-on: [self-hosted, linux, x64, pixel10-build]
    environment: pixel10-build
    timeout-minutes: 1440
    env:
      BUILD_NUMBER: ${{ inputs.build }}
      BUILD_ROOT: ${{ vars.BUILD_ROOT }}
      NATIVE_INPUTS: ${{ vars.NATIVE_INPUTS }}
      NATIVE_SHA256: ${{ vars.NATIVE_SHA256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: bash release/pixel10/build.sh
      - name: Record offline handoff
        shell: bash
        run: |
          cd "$BUILD_ROOT/$BUILD_NUMBER/unsigned"
          sha256sum SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
