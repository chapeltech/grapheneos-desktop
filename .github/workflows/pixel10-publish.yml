name: Sign and publish Pixel 10 release
on:
  workflow_dispatch:
    inputs:
      build:
        description: Build number on the prepared signing handoff
        required: true
      source_commit:
        description: Full release-branch commit recorded in the unsigned handoff
        required: true
      unsigned_digest:
        description: SHA-256 of SHA256SUMS from the unsigned build job
        required: true
      channel:
        type: choice
        description: Sign without publishing, sign and publish Beta, or promote a signed Beta to Stable
        options: [sign-only, beta, stable]
        required: true
      tested_from:
        description: Stable only - predecessor tested on locked hardware
      hardware_report:
        description: Stable only - URL of the physical qualification report
permissions: {}
concurrency:
  group: frankel-publication
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'chapeltech/grapheneos-desktop' && github.ref == 'refs/heads/release/pixel10'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release request
        shell: bash
        env:
          BUILD_NUMBER: ${{ inputs.build }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          UNSIGNED_SUMS_SHA256: ${{ inputs.unsigned_digest }}
          REF_PROTECTED: ${{ github.ref_protected }}
          SIGNING_ENABLED: ${{ vars.PIXEL10_SIGNING_ENABLED }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          test "$REF_PROTECTED" = true || { echo 'Protect release/pixel10 before using the release workflow.' >&2; exit 1; }
          [[ "$BUILD_NUMBER" =~ ^20[0-9]{8}$ && "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ && "$UNSIGNED_SUMS_SHA256" =~ ^[a-f0-9]{64}$ ]]
          test "$(git cat-file -t "$SOURCE_COMMIT")" = commit
          git merge-base --is-ancestor "$SOURCE_COMMIT" "$GITHUB_SHA"
          git diff --exit-code "$SOURCE_COMMIT" "$GITHUB_SHA" -- release/pixel10/OtaUrls.java release/pixel10/source.py release/pixel10/pins.json
          if [[ "$CHANNEL" != stable ]]; then
            test "$SIGNING_ENABLED" = true || { echo 'Pixel 10 automated signing has not been provisioned.' >&2; exit 1; }
          fi
          printf 'Build: `%s`\n\nSource: `%s`\n\nUnsigned SHA256SUMS digest: `%s`\n' \
            "$BUILD_NUMBER" "$SOURCE_COMMIT" "$UNSIGNED_SUMS_SHA256" >> "$GITHUB_STEP_SUMMARY"
  release:
    needs: preflight
    permissions:
      contents: write
    runs-on: ${{ vars.PIXEL10_GITHUB_RUNNER || 'ubuntu-24.04' }}
    environment: ${{ inputs.channel == 'stable' && 'pixel10-stable' || 'pixel10-sign' }}
    timeout-minutes: 360
    env:
      RELEASE_KIND: os
      CHANNEL: ${{ inputs.channel }}
      BUILD_NUMBER: ${{ inputs.build }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      UNSIGNED_SUMS_SHA256: ${{ inputs.unsigned_digest }}
      REF_PROTECTED: ${{ github.ref_protected }}
      TESTED_FROM_BUILD: ${{ inputs.tested_from }}
      HARDWARE_REPORT: ${{ inputs.hardware_report }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify signing protection and fetch the approved handoff
        env:
          GH_TOKEN: ${{ github.token }}
          HOSTED_RUNNER: ${{ runner.environment }}
          RELEASE_PHASE: prepare
        run: |
          python3 release/pixel10/hosted_security.py
          python3 release/pixel10/hosted_run.py
      - name: Sign using protected GitHub environment secrets
        if: inputs.channel != 'stable'
        env:
          RELEASE_PHASE: sign
          PIXEL10_OS_KEYS_1: ${{ secrets.PIXEL10_OS_KEYS_1 }}
          PIXEL10_OS_KEYS_2: ${{ secrets.PIXEL10_OS_KEYS_2 }}
          PIXEL10_OS_KEYS_3: ${{ secrets.PIXEL10_OS_KEYS_3 }}
          PIXEL10_APP_KEYS_1: ${{ secrets.PIXEL10_APP_KEYS_1 }}
          PIXEL10_APP_KEYS_2: ${{ secrets.PIXEL10_APP_KEYS_2 }}
        run: |
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"
          python3 release/pixel10/hosted_run.py
      - name: Verify signed files and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PHASE: verify-and-publish
        run: |
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"
          python3 release/pixel10/hosted_run.py
